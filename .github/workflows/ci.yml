name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: make lint
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh
      - run: make test-skills
